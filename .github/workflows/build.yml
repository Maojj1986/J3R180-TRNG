name: Build PureTRNG CAP

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Setup JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: 3. Download SDK and Tools
        run: |
          git clone --depth 1 https://github.com/martinpaljak/oracle_javacard_sdks.git
          curl -L -o ant-javacard.jar https://github.com/martinpaljak/ant-javacard/releases/latest/download/ant-javacard.jar

      - name: 4. Build PureTRNG.cap
        env:
          JC_HOME: ${{ github.workspace }}/oracle_javacard_sdks/jc304_kit
        run: |
          ant build
          ls -lh PureTRNG.cap

      - name: 5. Upload PureTRNG.cap
        uses: actions/upload-artifact@v4
        with:
          name: PureTRNG-cap-file
          path: PureTRNG.cap
